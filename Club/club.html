<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Page</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 40px;
      background: linear-gradient(to bottom right, #e0eafc, #cfdef3);
      margin: 0;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5em;
      color: #333;
    }
    .club-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .club-button {
      background: #ffffff;
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
      transition: background 0.3s, transform 0.3s;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      width: 250px;
    }
    .club-button:hover {
      background: #d1e8ff;
      transform: translateX(5px);
    }
  </style>
</head>
<body>
  <h1>Explore Our Clubs</h1>
  <div class="club-list">
    <a class="club-button" href="1_dance.html">Dance Club</a>
    <a class="club-button" href="1_music.html">Music Club</a>
    <a class="club-button" href="1_dsa.html">DSA Club</a>
    <a class="club-button" href="1_sport.html">Sports Club</a>
    <a class="club-button" href="codeforge.html">CodeForge Club</a>
  </div>
</body>
</html>
