<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Q&A Platform</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary rounded mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-university me-2"></i>GU Q&A
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <button class="btn btn-light" data-bs-toggle="modal" data-bs-target="#askQuestionModal">
                                <i class="fas fa-question-circle me-1"></i>Ask Question
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search questions...">
                    <button class="btn btn-primary" id="searchBtn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            <div class="col-md-4">
                <select class="form-select" id="sortSelect">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="mostVoted">Most Voted</option>
                </select>
            </div>
        </div>

        <!-- Questions List -->
        <div id="questionsContainer">
            <!-- Questions will be loaded here -->
        </div>

        <!-- No Questions Message -->
        <div id="noQuestions" class="text-center py-5" style="display: none;">
            <i class="fas fa-question-circle fa-3x text-muted mb-3"></i>
            <h4>No questions yet</h4>
            <p>Be the first to ask a question!</p>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#askQuestionModal">
                Ask a Question
            </button>
        </div>
    </div>

    <!-- Ask Question Modal -->
    <div class="modal fade" id="askQuestionModal" tabindex="-1" aria-labelledby="askQuestionModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="askQuestionModalLabel">Ask a Question</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="questionForm">
                        <div class="mb-3">
                            <label for="questionTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="questionTitle" required placeholder="What's your question?">
                        </div>
                        <div class="mb-3">
                            <label for="questionBody" class="form-label">Details</label>
                            <textarea class="form-control" id="questionBody" rows="3" required placeholder="Provide more details..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="questionAuthor" class="form-label">Your Name (optional)</label>
                            <input type="text" class="form-control" id="questionAuthor" placeholder="Anonymous">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="submitQuestion">Post Question</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Answer Modal -->
    <div class="modal fade" id="answerModal" tabindex="-1" aria-labelledby="answerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="answerModalLabel">Post an Answer</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="answerForm">
                        <div class="mb-3">
                            <label for="answerBody" class="form-label">Your Answer</label>
                            <textarea class="form-control" id="answerBody" rows="3" required placeholder="Write your answer here..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="answerAuthor" class="form-label">Your Name (optional)</label>
                            <input type="text" class="form-control" id="answerAuthor" placeholder="Anonymous">
                        </div>
                        <input type="hidden" id="currentQuestionId">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="submitAnswer">Post Answer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="./script.js">
    </script>
</body>
</html>
