<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rakhi Chauran Teacher Info</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #f9fbe7);
      color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
    }

    .card {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
      max-width: 700px;
      width: 100%;
      text-align: center;
      position: relative;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid #b2ebf2;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s;
    }

    .card img:hover {
      transform: scale(1.05) rotate(2deg);
    }

    h2 {
      margin-top: 20px;
      font-size: 2em;
      color: #00796b;
    }

    p {
      margin-top: 15px;
      font-size: 1.1em;
      line-height: 1.6;
      color: #555;
    }

    .links {
      margin: 25px 0;
    }

    .links a {
      margin: 0 15px;
      text-decoration: none;
      display: inline-block;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #00bcd4, #009688);
      box-shadow: 0 4px 12px rgba(0, 188, 212, 0.4);
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .links a:hover {
      background: linear-gradient(45deg, #009688, #00796b);
      transform: translateY(-2px);
    }

    h3 {
      margin-top: 30px;
      font-size: 1.5em;
      color: #388e3c;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1em;
      resize: vertical;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
      transition: border 0.3s;
    }

    textarea:focus {
      border-color: #26a69a;
      outline: none;
    }

    button {
      margin-top: 15px;
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #4caf50, #81c784);
      color: white;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: linear-gradient(90deg, #388e3c, #66bb6a);
    }

    @media (max-width: 768px) {
      .card {
        padding: 20px;
      }

      .links a {
        margin: 10px 5px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- <img src="teacher1.jpg" alt="John Doe"> -->
    <h2>Rakhi Chauhan - Software engineering</h2>
    <p>Rakhi mam has been teaching Mathematics for over 10 years with a passion for interactive and visual learning. His focus is helping students build strong problem-solving skills with confidence.</p>

    <div class="links">
      <a href="https://wa.me/1234567890" target="_blank">WhatsApp</a>
      <a href="https://www.linkedin.com/in/johndoe" target="_blank">LinkedIn</a>
      <a href="https://www.facebook.com/johndoe" target="_blank">Facebook</a>
    </div>

    <h3>Leave Your Feedback</h3>
    <form>
      <textarea placeholder="How was your interaction with the teacher?"></textarea><br>
      <button type="submit">Submit Feedback</button>
    </form>
  </div>

</body>
</html>
